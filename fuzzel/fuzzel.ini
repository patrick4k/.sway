[main]
font=monospace:size=12
dpi-aware=no
prompt="> "

[colors]
# Format is RRGGBBAA (no leading #)
# Colors borrowed from sway's default theme
background=222222f2
text=ffffffff
prompt=888888ff
input=ffffffff
match=5c9ccfff
selection=285577ff
selection-text=ffffffff
selection-match=8fc7f0ff
border=4c7899ff

[border]
width=2
radius=0

[key-bindings]
prev=Up Control+k
next=Down Control+j
delete-line-forward=none
